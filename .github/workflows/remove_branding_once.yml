name: One-time branding cleanup

on:
  push:
    branches:
      - agent/quitar-marca-dms

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/quitar-marca-dms

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Remove company branding
        run: python remove_branding_once.py

      - name: Verify cleanup
        shell: bash
        run: |
          if git grep -ni 'dms' -- ':!remove_branding_once.py' ':!.github/workflows/remove_branding_once.yml'; then
            echo 'Brand references remain in tracked text files.'
            exit 1
          fi
          if find . -path './.git' -prune -o -iname '*dms*' -print | grep -q .; then
            echo 'Brand references remain in file names.'
            find . -path './.git' -prune -o -iname '*dms*' -print
            exit 1
          fi

      - name: Commit sanitized repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes were produced.'
            exit 0
          fi
          git commit -m 'Remove company branding and use generic identity'
          git push origin HEAD:agent/quitar-marca-dms
